mode: rule

# =====================
# DNS设置
# =====================
dns:

  # 开启DNS
  enable: true

  # Fake-IP模式
  enhanced-mode: fake-ip

  # 远程DNS
  # Google DoH
  nameserver:
    - https://cloudflare-dns.com/dns-query

  # Bootstrap DNS
  # 用于解析dns.google域名
  default-nameserver:
    - 119.29.29.29

  # 解析代理节点服务器域名
  proxy-server-nameserver:
    - 119.29.29.29

# =====================
# 代理组
# =====================
proxy-groups:

  # 自动包含所有订阅节点
  - name: 🚀 节点选择
    type: select
    include-all: true

# =====================
# 分流规则
# =====================
rules:

  # UDP 443 禁止QUIC
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 局域网
  - GEOIP,PRIVATE,DIRECT
  - GEOSITE,PRIVATE,DIRECT

  # 国内直连
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # Apple服务直连
  - GEOSITE,apple,DIRECT

  # Steam下载直连
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT

  # 其他全部代理
  - MATCH,🚀 节点选择
