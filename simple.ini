mode: rule

dns:
  # 开启DNS
  enable: true

  # Fake-IP模式
  enhanced-mode: fake-ip

  # Fake-IP地址池
  fake-ip-range: 198.18.0.1/16

  # 国外DNS
  # 国外域名使用Cloudflare DoH
  nameserver:
    - https://cloudflare-dns.com/dns-query
    
   # 备用DNS（暂时关闭） 
   # - tls://8.8.8.8
   # - tls://1.1.1.1

  # 国内直连DNS
  direct-nameserver:
    - 119.29.29.29
    - 223.5.5.5

  # DNS分流
  # 国内域名使用国内DNS
  nameserver-policy:
    "geosite:cn":
      - 119.29.29.29
      - 223.5.5.5

  # 解析代理节点域名
  proxy-server-nameserver:
    - 119.29.29.29

  # Bootstrap DNS
  default-nameserver:
    - 119.29.29.29

  # 关闭IPv6
  ipv6: false

  # Fake-IP过滤
  fake-ip-filter:
    - +.lan
    - +.local
    - +.example.com


proxy-groups:
  # 自动包含所有节点
  - name: 🚀 节点选择
    type: select
    include-all: true


rules:
  # 禁止QUIC
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 局域网
  - GEOIP,PRIVATE,DIRECT,no-resolve
  - GEOSITE,PRIVATE,DIRECT

  # 国内直连
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  # Apple直连
  - GEOSITE,apple,DIRECT

  # Steam下载直连
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT

  # 其他代理
  - MATCH,🚀 节点选择
